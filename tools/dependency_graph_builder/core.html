<title>PLC Framework — Dependency Graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /*
    Deliberate single-theme commitment: this mirrors an industrial HMI / SCADA
    panel — those screens are dark by convention, with bright reserved status
    colors, so the page stays dark regardless of prefers-color-scheme.
  */
  :root {
    --bg: #0b0f15;
    --bg-grid: #10161f;
    --surface: #131a24;
    --surface-2: #1a2330;
    --surface-3: #212c3b;
    --ink: #e9edf3;
    --ink-muted: #8894a6;
    --ink-faint: #576376;
    --line: #263141;
    --line-soft: #1b232f;
    --brand: #e22d50;
    --brand-soft: rgba(226, 45, 80, 0.16);
    --status-ok: #3fc98a;
    --status-ok-soft: rgba(63, 201, 138, 0.14);
    --status-warn: #e8a63d;
    --status-warn-soft: rgba(232, 166, 61, 0.16);
    --status-critical: #ff5d5d;
    --status-critical-soft: rgba(255, 93, 93, 0.16);
    --status-info: #6f93d8;
    --status-info-soft: rgba(111, 147, 216, 0.14);
    --font-sans: "Segoe UI", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 0.8125rem;
    line-height: 1.5;
  }

  ::selection { background: var(--brand-soft); color: var(--ink); }

  button, input {
    font: inherit;
    color: inherit;
  }

  button {
    background: none;
    border: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 140%);
    flex-shrink: 0;
  }

  .mark { flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(226, 45, 80, 0.25)); }

  .titles { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; }

  .titles h1 {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .titles .sub {
    font-size: 0.75rem;
    color: var(--ink-muted);
    font-family: var(--font-mono);
  }

  .stat-row {
    display: flex;
    gap: 8px;
    margin-left: auto;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
  }

  .stat .n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.8125rem;
    font-weight: 600;
  }

  .stat .l {
    font-size: 0.6875rem;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat.critical .n { color: var(--status-critical); }
  .stat.warn .n { color: var(--status-warn); }
  .stat.info .n { color: var(--status-info); }
  button.stat { cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  button.stat:hover { border-color: var(--ink-muted); background: var(--surface-3); }
  button.stat.active { border-color: var(--brand); background: var(--brand-soft); }

  .tabs { display: flex; align-items: center; gap: 4px; }
  .tabs button {
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 0.8125rem;
    color: var(--ink-muted);
  }
  .tabs button:hover { color: var(--ink); background: var(--surface-2); }
  .tabs button.active { color: var(--ink); background: var(--surface-3); font-weight: 600; }

  /* ---------- body ---------- */
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 258px 1fr 340px;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "rail header header"
      "rail stage  detail";
    min-height: 0;
  }
  .body.no-detail { grid-template-columns: 258px 1fr 0px; }

  /* ---------- rail ---------- */
  .rail {
    grid-area: rail;
    border-right: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .rail-search {
    padding: 12px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }

  .rail-search input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--ink);
  }
  .rail-search input::placeholder { color: var(--ink-faint); }

  .rail-list {
    overflow-y: auto;
    padding: 6px;
  }

  .rail-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 9px;
    border-radius: 6px;
    text-align: left;
  }

  .rail-item:hover { background: var(--surface-2); }
  .rail-item.active { background: var(--surface-3); }
  .rail-item.dim { opacity: 0.32; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--ink-faint);
  }
  .dot.critical { background: var(--status-critical); box-shadow: 0 0 8px rgba(255, 93, 93, 0.55); }
  .dot.warn { background: var(--status-warn); }
  .dot.ok { background: var(--status-ok); }

  .rail-item .meta { min-width: 0; flex: 1; }
  .rail-item .name { font-weight: 600; font-size: 0.8125rem; }
  .rail-item .desc {
    font-size: 0.6875rem;
    color: var(--ink-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rail-item .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.6875rem;
    color: var(--ink-faint);
  }

  /* ---------- stage ---------- */
  .stage {
    grid-area: stage;
    position: relative;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--bg);
  }

  .stage-header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 15, 21, 0.6);
    backdrop-filter: blur(2px);
    flex-shrink: 0;
  }

  .crumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8125rem;
  }
  .crumb button {
    color: var(--ink-muted);
    padding: 3px 6px;
    border-radius: 4px;
  }
  .crumb button:hover { color: var(--ink); background: var(--surface-2); }
  .crumb .current { color: var(--ink); font-weight: 600; font-family: var(--font-mono); }
  .crumb .sep { color: var(--ink-faint); }

  .legend {
    margin-left: auto;
    display: flex;
    gap: 14px;
    font-size: 0.6875rem;
    color: var(--ink-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }

  .canvas-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
  }

  svg#canvas { display: block; }

  .node-circle {
    fill: var(--bubble-color, var(--surface-3));
    stroke: var(--line);
    stroke-width: 1.5;
    cursor: pointer;
    transition: stroke 0.15s ease, filter 0.15s ease, r 0.15s ease;
  }
  .node-circle:hover { filter: brightness(1.4); stroke: var(--ink-muted); }
  .node.selected .node-circle { filter: brightness(1.3); }
  .node.dim { opacity: 0.22; }
  .node-icon { pointer-events: none; }
  .node.severity-critical .node-circle { stroke: var(--status-critical); stroke-width: 2; }
  .node.severity-warn .node-circle { stroke: var(--status-warn); stroke-width: 2; }
  .node.severity-info .node-circle { stroke: var(--status-info); }
  .node.severity-ok .node-circle { stroke: var(--status-ok); stroke-width: 2; }

  .node-label {
    fill: var(--ink-muted);
    font-family: var(--font-mono);
    font-size: 9.5px;
    pointer-events: none;
  }
  .node.selected .node-label, .node-circle:hover + .node-label { fill: var(--ink); }

  .module-label {
    fill: var(--ink);
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 12px;
    pointer-events: none;
  }
  .module-count {
    fill: var(--ink-muted);
    font-family: var(--font-mono);
    font-size: 9px;
    pointer-events: none;
  }

  .edge-line { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .edge-line.hi { stroke: var(--ink-muted); stroke-width: 1.6; }
  .edge-agg { stroke: var(--line); fill: none; }

  /* ---------- reports panel ---------- */
  .reports-panel {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .reports-panel[hidden] { display: none; }

  .report-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left-width: 3px;
    border-radius: 6px;
  }
  .report-row.level-error { border-left-color: var(--status-critical); }
  .report-row.level-warning { border-left-color: var(--status-warn); }
  .report-row.level-info { border-left-color: var(--status-info); }

  .report-level {
    flex-shrink: 0;
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-top: 1px;
  }
  .report-level.error { color: var(--status-critical); background: var(--status-critical-soft); }
  .report-level.warning { color: var(--status-warn); background: var(--status-warn-soft); }
  .report-level.info { color: var(--status-info); background: var(--status-info-soft); }

  .report-body { min-width: 0; flex: 1; }
  .report-msg { font-size: 0.8125rem; line-height: 1.5; text-wrap: pretty; }
  .report-type {
    font-family: var(--font-mono);
    font-size: 0.625rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
    display: block;
  }
  .report-targets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .report-jump {
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-muted);
  }
  .report-jump:hover { color: var(--brand); border-color: var(--brand); }

  @media (prefers-reduced-motion: no-preference) {
    .node { transition: opacity 0.25s ease; }
  }

  /* ---------- detail panel ---------- */
  .detail {
    grid-area: detail;
    border-left: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 16px;
  }
  .detail[hidden] { display: none; }

  .detail-empty {
    color: var(--ink-faint);
    font-size: 0.8125rem;
    padding: 24px 4px;
    text-align: center;
  }

  .detail h2 {
    font-family: var(--font-mono);
    font-size: 1rem;
    margin: 0 0 2px;
    word-break: break-word;
    text-wrap: balance;
  }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
  .badge {
    font-size: 0.6875rem;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    font-family: var(--font-mono);
  }
  .badge.ok { color: var(--status-ok); border-color: color-mix(in srgb, var(--status-ok) 40%, var(--line)); background: var(--status-ok-soft); }
  .badge.warn { color: var(--status-warn); border-color: color-mix(in srgb, var(--status-warn) 40%, var(--line)); background: var(--status-warn-soft); }
  .badge.critical { color: var(--status-critical); border-color: color-mix(in srgb, var(--status-critical) 40%, var(--line)); background: var(--status-critical-soft); }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 0.75rem; margin-bottom: 16px; }
  .kv dt { color: var(--ink-faint); }
  .kv dd { margin: 0; font-family: var(--font-mono); color: var(--ink); word-break: break-all; }

  .detail h3 {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin: 18px 0 8px;
  }

  .dep-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .dep-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    background: var(--surface-2);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  .dep-row button.jump {
    background: none;
    color: inherit;
    text-align: left;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dep-row button.jump:hover { color: var(--brand); }
  .dep-tag {
    font-size: 0.625rem;
    padding: 1px 6px;
    border-radius: 999px;
    flex-shrink: 0;
    font-family: var(--font-sans);
  }
  .dep-tag.resolved { background: var(--status-ok-soft); color: var(--status-ok); }
  .dep-tag.ambiguous { background: var(--status-critical-soft); color: var(--status-critical); }
  .dep-tag.external { background: var(--status-info-soft); color: var(--status-info); }

  .empty-hint { color: var(--ink-faint); font-size: 0.75rem; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface-3);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--ink);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    z-index: 20;
    max-width: 280px;
  }
  .tooltip .t-name { font-weight: 600; }
  .tooltip .t-sub { color: var(--ink-muted); font-size: 0.6875rem; margin-top: 2px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 6px; border: 2px solid var(--surface); }
</style>

    n.hasExternal = n.outEdges.some(function (e) { return e.external; });
    n.hasUnknownDep = n.outEdges.some(function (e) { return e.kind === "unknown"; });
    n.hasBrokenDeprecation = !!(n.deprecatedBy && !nodesById[n.deprecatedBy]);
    n.dependsOnDeprecated = n.outEdges.some(function (e) {
      return e.resolved && nodesById[e.to] && nodesById[e.to].isLegacy;
    });
    var onlyKnownExternal = n.outEdges.length > 0 && n.outEdges.every(function (e) { return e.external && e.kind !== "unknown"; });
    n.severity = (n.hasAmbiguous || n.isMismatch || n.hasBrokenDeprecation) ? "critical"
      : (n.isLegacy || n.dependsOnDeprecated || n.hasUnknownDep) ? "warn"
      : onlyKnownExternal ? "info"
      : "ok";
  });

  // Recursive folder tree: each node has .children (subfolders, keyed by
  // name) and .files (blocks that live directly in that folder). Built once,
  // then walked at arbitrary depth to mirror the real directory structure.
  var tree = { children: {}, files: [] };
  RAW.nodes.forEach(function (n) {
    var cursor = tree;
    n.pathSegs.forEach(function (seg) {
      if (!cursor.children[seg]) cursor.children[seg] = { key: seg, children: {}, files: [] };
      cursor = cursor.children[seg];
    });
    cursor.files.push(n);
  });

  function aggregateTree(node) {
    var allNodes = node.files.slice();
    var hasCritical = node.files.some(function (f) { return f.severity === "critical"; });
    var hasWarn = node.files.some(function (f) { return f.severity === "warn"; });
    Object.keys(node.children).forEach(function (key) {
      var child = node.children[key];
      aggregateTree(child);
      allNodes = allNodes.concat(child.allNodes);
      if (child.hasCritical) hasCritical = true;
      if (child.hasWarn) hasWarn = true;
    });
    node.allNodes = allNodes;
    node.hasCritical = hasCritical;
    node.hasWarn = hasWarn;
  }
  aggregateTree(tree);

  var moduleList = Object.keys(tree.children).sort(function (a, b) {
    return tree.children[b].allNodes.length - tree.children[a].allNodes.length;
  });

  function treeAt(path) {
    var cursor = tree;
    for (var i = 0; i < path.length; i++) {
      cursor = cursor.children[path[i]];
      if (!cursor) return null;
    }
    return cursor;
  }

  // The groups shown as bubbles at a given path: one per child subfolder,
  // plus a "(general)" bucket for files that live directly in this folder
  // alongside those subfolders (if any).
  function groupsAt(node) {
    var groups = {};
    Object.keys(node.children).forEach(function (key) { groups[key] = node.children[key]; });
    if (node.files.length) {
      groups[GENERAL_SUBMODULE] = {
        key: GENERAL_SUBMODULE, children: {}, files: node.files, allNodes: node.files,
        hasCritical: node.files.some(function (f) { return f.severity === "critical"; }),
        hasWarn: node.files.some(function (f) { return f.severity === "warn"; })
      };
    }
    return groups;
  }
  function groupKeysAt(node) {
    var groups = groupsAt(node);
    return Object.keys(groups).sort(function (a, b) {
      return groups[b].allNodes.length - groups[a].allNodes.length;
    });
  }

  // ---------------- stats ----------------
  var deprecatedCount = 0;
  RAW.nodes.forEach(function (n) {
    if (n.isLegacy) deprecatedCount++;
  });

  document.getElementById("generated-at").textContent =
    "core · generated " + new Date(RAW.generatedAt).toLocaleString();

  function reportCount(types) {
    var list = Array.isArray(types) ? types : [types];
    return RAW.reports.filter(function (r) { return list.indexOf(r.type) !== -1; }).length;
  }

  // What a source says about itself disagreeing - its name, its TITLE, its header.
  var COHERENCE = ["missing-version", "missing-title", "version-mismatch", "header-mismatch"];

  var statRow = document.getElementById("stat-row");
  [
    { n: RAW.nodes.length, l: "Blocks" },
    { n: RAW.edges.filter(function (e) { return e.resolved; }).length, l: "Links" },
    { n: reportCount(["ambiguous-dependency", "broken-deprecation"]), l: "Need a pin", cls: "critical", reportType: ["ambiguous-dependency", "broken-deprecation"] },
    { n: reportCount(COHERENCE), l: "Inconsistent", cls: "critical", reportType: COHERENCE },
    { n: reportCount("name-mismatch"), l: "Mismatches", cls: "warn", reportType: "name-mismatch" },
    { n: reportCount("unknown-dependency"), l: "Uncataloged", cls: "warn", reportType: "unknown-dependency" },
    { n: deprecatedCount, l: "Legacy", cls: "warn" },
    { n: reportCount(["system-dependency", "untracked-dependency"]), l: "External", cls: "info", reportType: ["system-dependency", "untracked-dependency"] }
  ].forEach(function (s) {
    var el = document.createElement(s.reportType ? "button" : "div");
    el.className = "stat" + (s.cls ? " " + s.cls : "");
    el.innerHTML = '<span class="n">' + s.n + '</span><span class="l">' + s.l + "</span>";
    if (s.reportType) el.addEventListener("click", function () { renderReports(s.reportType); });
    statRow.appendChild(el);
  });

  var nodesByFile = {};
  RAW.nodes.forEach(function (n) { nodesByFile[n.file] = n.id; });

  // ---------------- state ----------------
  var state = { level: "overview", path: [], selected: null, query: "", reportFilter: null };

  var svg = document.getElementById("canvas");
  var canvasWrap = document.getElementById("canvas-wrap");
  var reportsPanel = document.getElementById("reports-panel");
  var legend = document.getElementById("legend");
  var tooltip = document.getElementById("tooltip");
  var SVG_NS = "http://www.w3.org/2000/svg";

  function el(tag, attrs) {
    var e = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // Deterministic soft fill per bubble, keyed by its id — same key always
  // gets the same hue, distinct bubbles read apart at a glance without
  // competing with the status rings (which stay stroke-only, reserved colors).
  function bubbleColorStyle(seed) {
    var hash = 0;
    for (var i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
    var hue = hash % 360;
    return "--bubble-color: hsla(" + hue + ", 55%, 62%, 0.16)";
  }

  function fileEmoji(file) {
    if (/\.udt$/i.test(file)) return "📜";
    if (/\.xlsx$/i.test(file)) return "📊";
    return "🔩";
  }

  // Renders a name (split into lines on "-"/space) plus a count line,
  // vertically centered and contained inside a bubble of radius r.
  // Long single words shrink the font modestly instead of overflowing.
  function appendBubbleLabel(g, cx, cy, name, countText) {
    var parts = name.split(/[-\s]+/).filter(Boolean);
    if (!parts.length) parts = [name];
    var maxLen = Math.max.apply(null, parts.map(function (p) { return p.length; }));
    var fontSize = maxLen > 10 ? Math.max(9, 12 - (maxLen - 10) * 0.4) : 12;
    var lineHeight = fontSize * 1.2;
    var countLineHeight = 12;
    var totalHeight = parts.length * lineHeight + countLineHeight;
    var firstDy = -(totalHeight / 2) + lineHeight * 0.78;

    var text = el("text", {
      class: "module-label", x: cx, y: cy, "text-anchor": "middle",
      style: "font-size:" + fontSize.toFixed(1) + "px"
    });
    parts.forEach(function (part, idx) {
      var tspan = el("tspan", { x: cx, dy: idx === 0 ? firstDy : lineHeight });
      tspan.textContent = part;
      text.appendChild(tspan);
    });
    var countSpan = el("tspan", { class: "module-count", x: cx, dy: lineHeight * 0.75 + countLineHeight * 0.6 });
    countSpan.textContent = countText;
    text.appendChild(countSpan);
    g.appendChild(text);
  }

  // ---------------- force layout ----------------
  function layout(nodes, links, width, height, iterations, padExtra) {
    padExtra = padExtra || 8;
    var n = nodes.length;
    nodes.forEach(function (node, i) {
      var angle = (i / n) * Math.PI * 2;
      var r = Math.min(width, height) * 0.34;
      node.x = width / 2 + Math.cos(angle) * r + (Math.random() - 0.5) * 8;
      node.y = height / 2 + Math.sin(angle) * r + (Math.random() - 0.5) * 8;
      node.vx = 0; node.vy = 0;
    });
    var REPULSION = 2400, SPRING = 0.02, DAMPING = 0.82, CENTER = 0.008;
    var REST = Math.max(60, (Math.min(width, height) / Math.sqrt(n || 1)) * 1.3);
    var COLLISION_PAD = 6;
    for (var it = 0; it < iterations; it++) {
      for (var i = 0; i < n; i++) {
        for (var j = i + 1; j < n; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var d2 = dx * dx + dy * dy || 0.01;
          var d = Math.sqrt(d2);
          var f = REPULSION / d2;
          dx /= d; dy /= d;
          a.vx += dx * f; a.vy += dy * f;
          b.vx -= dx * f; b.vy -= dy * f;
        }
      }
      links.forEach(function (l) {
        var na = l.a, nb = l.b;
        var dx = nb.x - na.x, dy = nb.y - na.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var f = (d - REST) * SPRING;
        dx /= d; dy /= d;
        na.vx += dx * f; na.vy += dy * f;
        nb.vx -= dx * f; nb.vy -= dy * f;
      });
      nodes.forEach(function (node) {
        node.vx += (width / 2 - node.x) * CENTER;
        node.vy += (height / 2 - node.y) * CENTER;
        node.vx *= DAMPING; node.vy *= DAMPING;
        node.x += node.vx; node.y += node.vy;
      });

      // Hard collision resolution: guarantees circles never overlap,
      // regardless of how the generic repulsion/spring forces above
      // settle (those don't know about each node's actual radius).
      for (var pass = 0; pass < 3; pass++) {
        for (var i2 = 0; i2 < n; i2++) {
          for (var j2 = i2 + 1; j2 < n; j2++) {
            var na2 = nodes[i2], nb2 = nodes[j2];
            var minDist = (na2.r || 8) + (nb2.r || 8) + COLLISION_PAD;
            var dx2 = nb2.x - na2.x, dy2 = nb2.y - na2.y;
            var d3 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 0.01;
            if (d3 < minDist) {
              var push = (minDist - d3) / 2;
              dx2 /= d3; dy2 /= d3;
              na2.x -= dx2 * push; na2.y -= dy2 * push;
              nb2.x += dx2 * push; nb2.y += dy2 * push;
            }
          }
        }
      }

      nodes.forEach(function (node) {
        var pad = (node.r || 8) + padExtra;
        node.x = Math.max(pad, Math.min(width - pad, node.x));
        node.y = Math.max(pad, Math.min(height - pad, node.y));
      });
    }
  }

  // ---------------- rendering ----------------
  function clearSvg() { while (svg.firstChild) svg.removeChild(svg.firstChild); }

  function showTooltip(evt, title, sub) {
    tooltip.innerHTML = '<div class="t-name">' + title + '</div>' + (sub ? '<div class="t-sub">' + sub + "</div>" : "");
    tooltip.hidden = false;
    positionTooltip(evt);
  }
  function positionTooltip(evt) {
    var x = evt.clientX + 14, y = evt.clientY + 14;
    tooltip.style.left = Math.min(x, window.innerWidth - 300) + "px";
    tooltip.style.top = Math.min(y, window.innerHeight - 60) + "px";
  }
  function hideTooltip() { tooltip.hidden = true; }

  // Whether a file's folder (its full pathSegs) sits at-or-under a given path.
  function nodeUnderPath(n, path) {
    if (n.pathSegs.length < path.length) return false;
    for (var i = 0; i < path.length; i++) if (n.pathSegs[i] !== path[i]) return false;
    return true;
  }
  // Which group (child-folder name, or the general bucket) a file belongs to
  // at a given path — one level below that path.
  function groupKeyForNode(n, path) {
    return n.pathSegs.length > path.length ? n.pathSegs[path.length] : GENERAL_SUBMODULE;
  }

  function isGeneralPath(path) {
    return path.length > 0 && path[path.length - 1] === GENERAL_SUBMODULE;
  }

  function openPath(path) {
    if (isGeneralPath(path)) {
      // "(general)" is a synthetic bucket for files that sit directly in a
      // folder alongside its subfolders — not a real tree node, so it always
      // resolves straight to the blocks view of its parent's direct files.
      state.path = path;
      state.selected = null;
      state.level = "blocks";
      renderBlocksAt(path);
      return;
    }
    var node = treeAt(path) || tree;
    if (!treeAt(path)) path = [];
    state.path = path;
    state.selected = null;
    if (Object.keys(node.children).length > 0) {
      state.level = path.length === 0 ? "overview" : "folder";
      renderFolderBubbles(path);
    } else {
      state.level = "blocks";
      renderBlocksAt(path);
    }
  }

  function matchesFolder(key, node, query) {
    var q = query.toLowerCase();
    if (key.toLowerCase().indexOf(q) !== -1) return true;
    if (MODULE_META[key] && MODULE_META[key].label.toLowerCase().indexOf(q) !== -1) return true;
    return node.allNodes.some(function (n) { return n.id.toLowerCase().indexOf(q) !== -1; });
  }

  function renderFolderBubbles(path) {
    state.reportFilter = null;
    canvasWrap.hidden = false;
    legend.hidden = false;
    reportsPanel.hidden = true;
    updateCrumb();
    clearSvg();

    var atRoot = path.length === 0;
    var parentNode = treeAt(path);
    var groups = groupsAt(parentNode);
    var keys = groupKeysAt(parentNode);

    var width = Math.max(canvasWrap.clientWidth, 700);
    var height = Math.max(canvasWrap.clientHeight, 560);
    svg.setAttribute("width", width);
    svg.setAttribute("height", height);
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    var nodes = keys.map(function (key) {
      var grp = groups[key];
      var baseR = atRoot ? 28 : 24;
      var scale = atRoot ? 5.5 : 5;
      return { id: key, r: baseR + Math.sqrt(grp.allNodes.length) * scale, count: grp.allNodes.length, grp: grp };
    });
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });

    var pairCounts = {};
    RAW.edges.forEach(function (e) {
      if (!e.resolved) return;
      var fn = nodesById[e.from], tn = nodesById[e.to];
      if (!nodeUnderPath(fn, path) || !nodeUnderPath(tn, path)) return;
      var fg = groupKeyForNode(fn, path), tg = groupKeyForNode(tn, path);
      if (fg === tg) return;
      var pkey = fg < tg ? fg + "|" + tg : tg + "|" + fg;
      pairCounts[pkey] = (pairCounts[pkey] || 0) + 1;
    });
    var links = Object.keys(pairCounts).map(function (pkey) {
      var parts = pkey.split("|");
      return { a: byId[parts[0]], b: byId[parts[1]], count: pairCounts[pkey] };
    }).filter(function (l) { return l.a && l.b; });

    layout(nodes, links, width, height, atRoot ? 260 : 240);

    var gLinks = el("g", {});
    links.forEach(function (l) {
      gLinks.appendChild(el("line", {
        class: "edge-agg", x1: l.a.x, y1: l.a.y, x2: l.b.x, y2: l.b.y,
        "stroke-width": Math.min(6, 0.6 + l.count * 0.35), opacity: 0.55
      }));
    });
    svg.appendChild(gLinks);

    var gNodes = el("g", {});
    nodes.forEach(function (n) {
      var meta = atRoot && MODULE_META[n.id];
      var label = meta ? meta.label : n.id;
      var match = state.query && matchesFolder(n.id, n.grp, state.query);
      var dim = state.query && !match;
      var g = el("g", { class: "node severity-" + (n.grp.hasCritical ? "critical" : n.grp.hasWarn ? "warn" : "ok") + (dim ? " dim" : "") });
      var c = el("circle", { class: "node-circle", cx: n.x, cy: n.y, r: n.r, style: bubbleColorStyle(path.concat([n.id]).join("/")) });
      g.appendChild(c);
      appendBubbleLabel(g, n.x, n.y, label, n.count + " blocks");

      g.addEventListener("click", function () { openPath(path.concat([n.id])); });
      g.addEventListener("mousemove", function (evt) {
        showTooltip(evt, label, (meta ? meta.desc + " · " : "") + n.count + " blocks");
      });
      g.addEventListener("mouseleave", hideTooltip);
      gNodes.appendChild(g);
    });
    svg.appendChild(gNodes);

    renderRail();
    renderDetail(null);
  }

  function renderBlocksAt(path) {
    state.reportFilter = null;
    canvasWrap.hidden = false;
    legend.hidden = false;
    reportsPanel.hidden = true;
    updateCrumb();
    clearSvg();
    var sourceNodes = isGeneralPath(path) ? treeAt(path.slice(0, -1)).files : treeAt(path).allNodes;
    var width = Math.max(canvasWrap.clientWidth, 700);
    var height = Math.max(canvasWrap.clientHeight, 560);
    svg.setAttribute("width", width);
    svg.setAttribute("height", height);
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    var nodes = sourceNodes.map(function (n) {
      return { ref: n, id: n.id, r: 8 + Math.min(n.inEdges.length, 6) * 1.4 };
    });
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });

    var links = [];
    RAW.edges.forEach(function (e) {
      if (!e.resolved) return;
      if (byId[e.from] && byId[e.to]) links.push({ a: byId[e.from], b: byId[e.to] });
    });

    layout(nodes, links, width, height, 220);

    var gLinks = el("g", {});
    links.forEach(function (l) {
      gLinks.appendChild(el("line", { class: "edge-line", x1: l.a.x, y1: l.a.y, x2: l.b.x, y2: l.b.y }));
    });
    svg.appendChild(gLinks);

    var gNodes = el("g", {});
    nodes.forEach(function (n) {
      var ref = n.ref;
      var match = state.query && (n.id.toLowerCase().indexOf(state.query.toLowerCase()) !== -1 || ref.name.toLowerCase().indexOf(state.query.toLowerCase()) !== -1);
      var dim = state.query && !match;
      var sel = state.selected === n.id;
      var renderR = sel ? n.r * 4 : n.r;
      var g = el("g", { class: "node severity-" + ref.severity + (dim ? " dim" : "") + (sel ? " selected" : "") });
      var c = el("circle", { class: "node-circle", cx: n.x, cy: n.y, r: renderR, style: bubbleColorStyle(n.id) });
      g.appendChild(c);
      var icon = el("text", {
        class: "node-icon", x: n.x, y: n.y, "text-anchor": "middle", dy: "0.35em",
        style: "font-size:" + Math.min(34, Math.max(8, renderR * 1.05)).toFixed(1) + "px"
      });
      icon.textContent = fileEmoji(ref.file);
      g.appendChild(icon);
      var label = el("text", { class: "node-label", x: n.x + renderR + 4, y: n.y + 3 });
      label.textContent = ref.version ? ref.name + " v" + ref.version : ref.name;
      g.appendChild(label);

      g.addEventListener("click", function () { selectNode(ref.id); });
      g.addEventListener("mousemove", function (evt) {
        showTooltip(evt, ref.name, ref.version ? "v" + ref.version + (ref.status !== "current" ? " · " + ref.status : "") : "");
      });
      g.addEventListener("mouseleave", hideTooltip);
      gNodes.appendChild(g);
    });
    svg.appendChild(gNodes);

    renderRail();
    if (state.selected) renderDetail(nodesById[state.selected]); else renderDetail(null);
  }

  function selectNode(id) {
    state.selected = id;
    if (state.level === "blocks") renderBlocksAt(state.path);
    renderDetail(nodesById[id]);
  }

  function goToNode(id) {
    var target = nodesById[id];
    if (!target) return;
    var node = treeAt(target.pathSegs);
    var path = (node && Object.keys(node.children).length > 0)
      ? target.pathSegs.concat([GENERAL_SUBMODULE])
      : target.pathSegs;
    openPath(path);
    selectNode(id);
  }

  function renderTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    var overviewBtn = document.createElement("button");
    overviewBtn.textContent = "Graph";
    overviewBtn.className = state.level !== "reports" ? "active" : "";
    overviewBtn.addEventListener("click", function () { openPath([]); });
    tabs.appendChild(overviewBtn);

    var reportsBtn = document.createElement("button");
    reportsBtn.textContent = "Reports (" + RAW.reports.length + ")";
    reportsBtn.className = state.level === "reports" ? "active" : "";
    reportsBtn.addEventListener("click", function () { renderReports(null); });
    tabs.appendChild(reportsBtn);
  }

  function addCrumbSep(crumb) {
    var sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "/";
    crumb.appendChild(sep);
  }

  function updateCrumb() {
    renderTabs();
    var crumb = document.getElementById("crumb");
    crumb.innerHTML = "";

    if (state.level === "folder" || state.level === "blocks") {
      state.path.forEach(function (seg, idx) {
        addCrumbSep(crumb);
        var label = idx === 0 && MODULE_META[seg] ? MODULE_META[seg].label : seg;
        var isLast = idx === state.path.length - 1;
        if (isLast) {
          var cur = document.createElement("span");
          cur.className = "current";
          cur.textContent = label;
          crumb.appendChild(cur);
        } else {
          var crumbPath = state.path.slice(0, idx + 1);
          var btn = document.createElement("button");
          btn.textContent = label;
          btn.addEventListener("click", function () { openPath(crumbPath); });
          crumb.appendChild(btn);
        }
      });
    } else if (state.level === "reports" && state.reportFilter) {
      addCrumbSep(crumb);
      var cur2 = document.createElement("span");
      cur2.className = "current";
      var filterList = Array.isArray(state.reportFilter) ? state.reportFilter : [state.reportFilter];
      cur2.textContent = filterList.map(function (t) { return REPORT_TYPE_LABEL[t] || t; }).join(" + ");
      crumb.appendChild(cur2);
    }
  }

  var REPORT_TYPE_LABEL = {
    "ambiguous-dependency": "Needs a version pin",
    "name-mismatch": "Name doesn't match file",
    "version-mismatch": "TITLE version doesn't match file",
    "missing-version": "No version in the file name",
    "missing-title": "No TITLE metadata",
    "header-mismatch": "Header doesn't match",
    "interface-unreadable": "Interface not readable",
    "broken-deprecation": "Broken deprecatedBy",
    "unknown-dependency": "Uncataloged dependencies",
    "system-dependency": "System dependencies",
    "untracked-dependency": "Dependencies outside core"
  };

  function renderReports(filterType) {
    state.level = "reports";
    state.reportFilter = filterType;
    state.selected = null;
    updateCrumb();

    canvasWrap.hidden = true;
    legend.hidden = true;
    reportsPanel.hidden = false;

    var filterList = filterType ? (Array.isArray(filterType) ? filterType : [filterType]) : null;
    var list = (filterList ? RAW.reports.filter(function (r) { return filterList.indexOf(r.type) !== -1; }) : RAW.reports.slice());
    var order = { error: 0, warning: 1, info: 2 };
    list.sort(function (a, b) { return order[a.level] - order[b.level]; });

    reportsPanel.innerHTML = "";
    if (!list.length) {
      reportsPanel.innerHTML = '<div class="empty-hint">No findings of this type.</div>';
    }
    list.forEach(function (r) {
      var targets = r.usedBy ? r.usedBy.slice() : (r.file && nodesByFile[r.file] ? [nodesByFile[r.file]] : []);
      var row = document.createElement("div");
      row.className = "report-row level-" + r.level;
      row.innerHTML =
        '<span class="report-level ' + r.level + '">' + r.level + "</span>" +
        '<div class="report-body">' +
        '<span class="report-type">' + r.type + "</span>" +
        '<div class="report-msg">' + r.message + "</div>" +
        (targets.length
          ? '<div class="report-targets">' + targets.map(function (t) {
              return '<button class="report-jump" data-jump="' + t + '">' + t + "</button>";
            }).join("") + "</div>"
          : "") +
        "</div>";
      reportsPanel.appendChild(row);
    });

    reportsPanel.querySelectorAll("[data-jump]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        goToNode(btn.getAttribute("data-jump"));
      });
    });

    renderRail();
    renderDetail(null);
  }

  function renderRail() {
    var list = document.getElementById("rail-list");
    list.innerHTML = "";
    moduleList.forEach(function (key) {
      var m = tree.children[key];
      var meta = MODULE_META[key] || { label: key, desc: "" };
      var btn = document.createElement("button");
      btn.className = "rail-item" + (state.path[0] === key ? " active" : "") +
        (state.query && !matchesFolder(key, m, state.query) ? " dim" : "");
      var dotCls = m.hasCritical ? "critical" : m.hasWarn ? "warn" : "ok";
      btn.innerHTML =
        '<span class="dot ' + dotCls + '"></span>' +
        '<span class="meta"><div class="name">' + meta.label + '</div><div class="desc">' + meta.desc + "</div></span>" +
        '<span class="count">' + m.allNodes.length + "</span>";
      btn.addEventListener("click", function () { openPath([key]); });
      list.appendChild(btn);
    });
  }

  function tagFor(e) {
    if (e.ambiguous) return '<span class="dep-tag ambiguous">ambiguous</span>';
    if (e.kind === "unknown") return '<span class="dep-tag ambiguous">uncataloged</span>';
    if (e.kind === "untracked") return '<span class="dep-tag external">outside core</span>';
    if (e.kind === "system") return '<span class="dep-tag external">system</span>';
    if (e.external) return '<span class="dep-tag external">external</span>';
    if (e.resolved) return '<span class="dep-tag resolved">ok</span>';
    return "";
  }

  function renderDetail(node) {
    var panel = document.getElementById("detail");
    var body = document.getElementById("body");
    if (!node) {
      panel.hidden = true;
      body.classList.add("no-detail");
      return;
    }
    panel.hidden = false;
    body.classList.remove("no-detail");

    var badges = "";
    if (node.status && node.status !== "current") badges += '<span class="badge warn">' + node.status + "</span>";
    else badges += '<span class="badge ok">current</span>';
    if (node.isMismatch) badges += '<span class="badge critical">name ≠ file</span>';
    if (node.hasBrokenDeprecation) badges += '<span class="badge critical">broken deprecatedBy</span>';

    var depsHtml = node.outEdges.length ? node.outEdges.map(function (e) {
      var label = e.to;
      var clickable = e.resolved && nodesById[e.to];
      return '<li class="dep-row">' + tagFor(e) +
        (clickable
          ? '<button class="jump" data-jump="' + e.to + '">' + label + "</button>"
          : '<span class="jump" style="opacity:.8">' + label + "</span>") +
        "</li>";
    }).join("") : '<li class="empty-hint">No dependencies declared.</li>';

    var usedByHtml = node.inEdges.length ? node.inEdges.map(function (e) {
      return '<li class="dep-row"><span class="dep-tag resolved">ok</span>' +
        '<button class="jump" data-jump="' + e.from + '">' + e.from + "</button></li>";
    }).join("") : '<li class="empty-hint">Nothing depends on this block yet.</li>';

    panel.innerHTML =
      "<h2>" + node.name + "</h2>" +
      '<div class="badge-row">' + badges + "</div>" +
      '<dl class="kv">' +
      "<dt>file</dt><dd>" + node.id + "</dd>" +
      "<dt>folder</dt><dd>" + node.pathSegs.join(" / ") + "</dd>" +
      "<dt>version</dt><dd>" + (node.version || "—") + "</dd>" +
      (node.deprecatedBy ? "<dt>replaced by</dt><dd>" + node.deprecatedBy + "</dd>" : "") +
      "<dt>path</dt><dd>" + node.file + "</dd>" +
      "</dl>" +
      "<h3>Dependencies (" + node.outEdges.length + ")</h3>" +
      '<ul class="dep-list">' + depsHtml + "</ul>" +
      "<h3>Used by (" + node.inEdges.length + ")</h3>" +
      '<ul class="dep-list">' + usedByHtml + "</ul>";

    panel.querySelectorAll("[data-jump]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        goToNode(btn.getAttribute("data-jump"));
      });
    });
  }

  function rerenderCurrent() {
    if (state.level === "overview" || state.level === "folder") renderFolderBubbles(state.path);
    else if (state.level === "blocks") renderBlocksAt(state.path);
  }

  document.getElementById("search").addEventListener("input", function (evt) {
    state.query = evt.target.value.trim();
    rerenderCurrent();
  });

  canvasWrap.addEventListener("click", function (evt) {
    if (evt.target !== canvasWrap && evt.target !== svg) return;
    if (state.selected === null) return;
    state.selected = null;
    rerenderCurrent();
  });

  document.addEventListener("mousemove", function (evt) {
    if (!tooltip.hidden) positionTooltip(evt);
  });

  window.addEventListener("resize", function () {
    rerenderCurrent();
  });

  openPath([]);
  }

  fetch("./core.json")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(init)
    .catch(function (err) {
      document.body.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'background:#0b0f15;color:#e9edf3;font-family:system-ui,sans-serif;padding:24px;">' +
        '<div style="max-width:480px">' +
        '<h1 style="color:#ff5d5d;font-size:1.1rem;margin:0 0 10px">Could not load core.json</h1>' +
        '<p style="margin:0 0 8px;line-height:1.6">This viewer needs to be served over HTTP, not opened ' +
        'directly with a double-click (<code>file://</code>). Try <code>python -m http.server</code> from ' +
        'this folder, or publish it on GitHub Pages.</p>' +
        '<p style="opacity:.6;font-size:.8rem;font-family:ui-monospace,monospace">' + err + '</p>' +
        '</div></div>';
    });
})();
</script>
